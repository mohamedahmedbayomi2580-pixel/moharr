<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My UI Builder</title>
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<header id="top">
  <b>My UI Builder</b>
  <button id="bNew">جديد</button><button id="bOpen">فتح</button><button id="bSave">حفظ</button>
  <button id="bUndo">تراجع</button><button id="bRedo">إعادة</button>
  <select id="dev"><option value="100%">كمبيوتر</option><option value="768px">لوح</option><option value="375px">هاتف</option></select>
  <button id="bPrev">معاينة</button><button id="bCode">عرض الكود</button>
  <button id="bExp" class="pri">تصدير المشروع (ZIP)</button>
  <button id="bBak">نسخة احتياطية</button><button id="bImp">استيراد</button>
  <input type="file" id="fImp" accept=".json,application/json" hidden>
  <input type="file" id="fImg" accept="image/*" hidden>
  <span id="status"></span>
</header>
<div id="main">
  <aside id="pal"></aside>
  <section id="stage"><div id="canvas"></div></section>
  <aside id="props"><div id="pages"></div><div id="fields"></div></aside>
</div>
<div id="modal" hidden><div class="box"><div class="mh"><b id="mt"></b><button id="mx">إغلاق</button></div><div id="mb"></div></div></div>
<script src="js/model.js"></script><script src="js/zip.js"></script><script src="js/exporter.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
</body>
</html>
